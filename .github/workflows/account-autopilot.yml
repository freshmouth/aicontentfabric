name: Multi-Account V3 Autopilot
run-name: Factory ${{ inputs.account || 'all-due' }} - ${{ inputs.request_id || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Optional single account id. Empty means all due accounts."
        required: false
        default: ""
      force:
        description: "Run even when the account is not due"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Generate video but dry-run Metricool publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      plan_only:
        description: "Validate cloud auth, account config, and cadence without generation"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_at:
        description: "Optional ISO-8601 publish datetime override for a single-account run"
        required: false
        default: ""
      request_id:
        description: "Dashboard request id for status reconciliation"
        required: false
        default: ""
      request_payload_b64:
        description: "Base64-encoded account-scoped V3 generation request"
        required: false
        default: ""
      skip_publish:
        description: "Generate assets without scheduling or publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: account-v3-${{ inputs.account || 'all-due' }}
  cancel-in-progress: false

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLOUD_PROJECT: ai-content-factory-501821
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      ACCOUNT_PUBLISH_SECRETS_JSON: ${{ secrets.ACCOUNT_PUBLISH_SECRETS_JSON }}
      SAL_CELTICA_METRICOOL_API_TOKEN: ${{ secrets.SAL_CELTICA_METRICOOL_API_TOKEN }}
      SAL_CELTICA_METRICOOL_USER_ID: ${{ secrets.SAL_CELTICA_METRICOOL_USER_ID }}
      SAL_CELTICA_METRICOOL_BLOG_ID: ${{ secrets.SAL_CELTICA_METRICOOL_BLOG_ID }}
      BEYOND_THE_LABEL_METRICOOL_API_TOKEN: ${{ secrets.BEYOND_THE_LABEL_METRICOOL_API_TOKEN }}
      BEYOND_THE_LABEL_METRICOOL_USER_ID: ${{ secrets.BEYOND_THE_LABEL_METRICOOL_USER_ID }}
      BEYOND_THE_LABEL_METRICOOL_BLOG_ID: ${{ secrets.BEYOND_THE_LABEL_METRICOOL_BLOG_ID }}
      HYPERDASH_METRICOOL_API_TOKEN: ${{ secrets.HYPERDASH_METRICOOL_API_TOKEN }}
      HYPERDASH_METRICOOL_USER_ID: ${{ secrets.HYPERDASH_METRICOOL_USER_ID }}
      HYPERDASH_METRICOOL_BLOG_ID: ${{ secrets.HYPERDASH_METRICOOL_BLOG_ID }}
      CLAIRE_METRICOOL_API_TOKEN: ${{ secrets.CLAIRE_METRICOOL_API_TOKEN }}
      CLAIRE_METRICOOL_USER_ID: ${{ secrets.CLAIRE_METRICOOL_USER_ID }}
      CLAIRE_METRICOOL_BLOG_ID: ${{ secrets.CLAIRE_METRICOOL_BLOG_ID }}
      SARAH_COLE_METRICOOL_API_TOKEN: ${{ secrets.SARAH_COLE_METRICOOL_API_TOKEN }}
      SARAH_COLE_METRICOOL_USER_ID: ${{ secrets.SARAH_COLE_METRICOOL_USER_ID }}
      SARAH_COLE_METRICOOL_BLOG_ID: ${{ secrets.SARAH_COLE_METRICOOL_BLOG_ID }}
      SPELIERS_METRICOOL_API_TOKEN: ${{ secrets.SPELIERS_METRICOOL_API_TOKEN }}
      SPELIERS_METRICOOL_USER_ID: ${{ secrets.SPELIERS_METRICOOL_USER_ID }}
      SPELIERS_METRICOOL_BLOG_ID: ${{ secrets.SPELIERS_METRICOOL_BLOG_ID }}
      FACTORY_REQUEST_PAYLOAD_B64: ${{ inputs.request_payload_b64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ai-content-factory-501821
          workload_identity_provider: projects/529307215825/locations/global/workloadIdentityPools/github-actions/providers/aicontentfabric
          service_account: daily-factory@ai-content-factory-501821.iam.gserviceaccount.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth requests tzdata

      - name: Validate cloud credentials
        shell: bash
        run: |
          MISSING=()
          for KEY in OPENAI_API_KEY GOOGLE_CLOUD_PROJECT GOOGLE_APPLICATION_CREDENTIALS; do
            if [[ -z "${!KEY:-}" ]]; then
              MISSING+=("$KEY")
            fi
          done
          ACCOUNT="${{ inputs.account }}"
          if [[ -z "$ACCOUNT" || "$ACCOUNT" == "sal_celtica" ]]; then
            if [[ -z "${ACCOUNT_PUBLISH_SECRETS_JSON:-}" ]]; then
              for KEY in SAL_CELTICA_METRICOOL_API_TOKEN SAL_CELTICA_METRICOOL_USER_ID SAL_CELTICA_METRICOOL_BLOG_ID; do
                if [[ -z "${!KEY:-}" ]]; then
                  MISSING+=("$KEY")
                fi
              done
            fi
          fi
          if (( ${#MISSING[@]} > 0 )); then
            echo "::error title=Missing GitHub Actions secrets::${MISSING[*]}"
            exit 1
          fi

      - name: Validate Google Omni ADC
        run: >-
          python -c "from pipeline_google_omni_stack.adapters.google_omni_flash import get_access_token;
          assert get_access_token('GOOGLE_OAUTH_ACCESS_TOKEN');
          print('Google Omni ADC ready')"

      - name: Run account autopilot
        shell: bash
        run: |
          ARGS=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.account }}" ]]; then
            ARGS+=(--account "${{ inputs.account }}")
          else
            ARGS+=(--all-due)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force }}" == "true" ]]; then
            ARGS+=(--force)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.plan_only }}" == "true" ]]; then
            ARGS+=(--plan-only)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.publish_at }}" ]]; then
            ARGS+=(--publish-at "${{ inputs.publish_at }}")
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${FACTORY_REQUEST_PAYLOAD_B64:-}" ]]; then
            REQUEST_FILE="$RUNNER_TEMP/factory-dashboard-request.json"
            printf '%s' "$FACTORY_REQUEST_PAYLOAD_B64" | base64 --decode > "$REQUEST_FILE"
            ARGS+=(--request-file "$REQUEST_FILE")
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.request_id }}" ]]; then
            ARGS+=(--request-id "${{ inputs.request_id }}")
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.skip_publish }}" == "true" ]]; then
            ARGS+=(--skip-publish)
          fi
          python tools/account_autopilot.py "${ARGS[@]}"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-autopilot-run
          path: |
            accounts/*/runs/autopilot_*/autopilot_plan.json
            accounts/*/runs/autopilot_*/autopilot_result.json
            accounts/*/runs/autopilot_*/omni_stdout.txt
            accounts/*/runs/autopilot_*/omni_stderr.txt
            accounts/*/runs/autopilot_*/metricool_stdout.txt
            accounts/*/runs/autopilot_*/metricool_stderr.txt
            accounts/*/runs/autopilot_*/publish_ready/*.postprocess.json
            accounts/*/runs/autopilot_*/publish_ready/*.ffmpeg_log.txt
          if-no-files-found: ignore
