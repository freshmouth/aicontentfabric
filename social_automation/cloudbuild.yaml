substitutions:
  _REGION: us-central1
  _SERVICE: meta-comment-automation

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-content-factory/${_SERVICE}:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-content-factory/${_SERVICE}:latest
