substitutions:
  _REGION: us-central1
  _REPOSITORY: ai-content-factory
  _IMAGE: daily-factory
  _TAG: manual
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - daily_factory/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
